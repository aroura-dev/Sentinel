server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 代理
    # 目标是 compose 里的网关服务名 `gateway`（容器名 sentinelms-gateway）。
    # 原先是 `backend` —— 单体时代的服务名，当前 compose 里不存在，会让所有 /api/ 请求 502。
    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
