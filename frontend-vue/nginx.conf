# 上游连接池：nginx 对 proxy_pass 默认用 HTTP/1.0 且不回传 keep-alive，
# 等于**每个 API 请求都新建一条到网关的 TCP 连接**。
# 实测 100 并发下这一跳砍掉约 47% 吞吐、延迟翻倍（1914 rps/48ms vs 直连 3584 rps/25ms）；
# 复用长连接后 3282 rps/28ms，基本追平直连。
#
# ⚠️ 只加 proxy_http_version 1.1 + Connection "" 而**不定义 upstream 块是无效的** ——
# nginx 仍不池化连接，反而制造连接风暴（实测 62.79% 502 / EADDRNOTAVAIL）。
# upstream 块与下面两条 proxy_* 必须同时存在。
upstream sentinel_gateway {
    server gateway:8080;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 代理
    # 目标是 compose 里的网关服务名 `gateway`（容器名 sentinelms-gateway）。
    # 原先是 `backend` —— 单体时代的服务名，当前 compose 里不存在，会让所有 /api/ 请求 502。
    location /api/ {
        proxy_pass http://sentinel_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 上游长连接复用时，Tomcat 达到 maxKeepAliveRequests 会主动关闭，
        # 复用到已关闭的连接会 502，这里按需重试一次。
        # 安全性：nginx 默认**不重试**已发出请求的非幂等方法（POST/LOCK/PATCH），
        # 只有幂等请求会走这里的重试 —— 所以本栈的 POST /api/logistics/notify/send
        # 不会被重试、不会产生重复通知。
        # ⚠️ 不要加 `non_idempotent` 参数：那会让 POST 也重试，通知会重复落库
        #    （虽有 24h 去重兜底，但那是补偿机制，不该被当成幂等保证来依赖）。
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
    }
}
