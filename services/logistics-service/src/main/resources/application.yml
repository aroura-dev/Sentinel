server:
  port: 8083
  # 收到 SIGTERM 后先处理完在途请求再退出（默认超时 30s），避免发布时丢请求。
  shutdown: graceful

# 健康检查：actuator 挂在 /actuator（不在 /api 前缀下），因此不经网关暴露；
# 配合端口收敛（见 infra/docker/compose.infra.yml），仅 compose 内部网络可达，
# 供容器 healthcheck 与编排就绪判断使用。
management:
  # 指标带服务名标签：多个服务汇聚到 Prometheus 后要能区分来源。
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

spring:
  # 分布式追踪。Sleuth 自动生成 traceId/spanId 放进 MDC，并跨 HTTP/Kafka 传递。
  # Zipkin 默认关闭：日志里的 traceId 不依赖上报服务，而没有收集端时开启上报只会刷连接错误日志。
  # 需要看链路拓扑时再开：ZIPKIN_ENABLED=true 并启用 observability profile。
  sleuth:
    sampler:
      probability: ${SLEUTH_SAMPLING_PROBABILITY:1.0}
  zipkin:
    enabled: ${ZIPKIN_ENABLED:false}
    base-url: ${ZIPKIN_BASE_URL:http://zipkin:9411}
    sender:
      type: web
  # 数据库迁移：schema 由 Flyway 拥有，迁移脚本在 classpath:db/migration。
  # 注意：本次改造前已存在的数据卷里，schema 是 initdb 建的、没有 flyway_schema_history 表，
  # 需要一次性重建数据卷（down -v）让 Flyway 接管；之后再变更 schema 直接加新版本脚本即可。
  flyway:
    enabled: true
    locations: classpath:db/migration
  # 配置中心：optional: 是红线 —— 拿不到配置也必须能启动。
  # 必须与 nacos-config starter 同时存在（SCA import-check 会因缺 spring.config.import 直接启动失败）。
  config:
    import:
      - optional:nacos:logistics-service.yml
      - optional:nacos:sentinel-common.yml
  # 服务注册发现：注册到 Nacos，供网关 lb://logistics-service 与 msg 的回执调用解析实例。
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
      config:
        refresh-enabled: true
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  application:
    name: logistics-service
  datasource:
    url: jdbc:mysql://127.0.0.1:33063/sentinel_logistics?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

sentinel:
  login:
    enabled: true

# 通知闭环相关开关/模板（与单体一致）
notify:
  dispatch:
    enabled: true
    template-id: 3
  dedup-hours: 24
  # 投递失败补偿（NotificationRetryTask）
  retry:
    enabled: true
    # 单轮扫描间隔与启动后首次延迟（毫秒）
    scan-interval-ms: 60000
    initial-delay-ms: 30000
    # 投递失败的最大重试次数，达到后停在 FAILED 等人工介入
    max-attempts: 5
    # 指数退避基数（秒）：第 n 次重试等待 base * 2^n
    base-backoff-seconds: 30
    # PENDING 超过该分钟数仍未投递完成，视为卡住（进程崩溃遗留）并转入重投
    stale-pending-minutes: 10
    # 认领租约（秒）：多实例下防止同一条被重复投递；必须大于单次投递耗时
    claim-lease-seconds: 60
    # 单轮最多处理条数，避免一轮把下游打满
    batch-size: 50

# 跨服务调用目标改为服务发现，不再在此写死地址：
# 两个客户端的 url 占位符是 ${service.agent-url:} / ${service.msg-url:}，留空即走
# Nacos + LoadBalancer 解析。原先这里的 http://127.0.0.1:8084/8082 在容器里根本不可达
# （那是宿主机视角），只适合本机直跑 jar 联调；需要退回静态直连时再把它们加回来。

# Feign 出站超时：对齐改造前 RestConfig 的 3s(connect)/8s(read)。
# 不要开 feign.okhttp.enabled —— 那会换掉 Feign 默认 client，让超时/连接行为漂移。
# 也不配重试：重试由 NotificationRetryTask + 状态机负责（Feign 默认 Retryer.NEVER_RETRY）。
#
# ⚠️ 本服务**刻意不启用 Feign 熔断**（不要在这里加 feign.circuitbreaker.enabled: true）。
# 两重理由：
#  1. 语义冲突：dispatch() 用 catch(Exception) 把一切失败收敛成 scheduleRetry()。
#     断路器 OPEN 时抛的 CallNotPermittedException 会被当成"下游拒绝受理"，
#     于是在**从未真正探测下游**的情况下逐次消耗 retry_count ——
#     把本可恢复的通知推成终态 FAILED（与熔断"给下游恢复机会"的本意正好相反）。
#  2. 开关是服务级的：本服务有 MsgClient + AgentClient 两个客户端，无法只给其中一个加。
# 本层的韧性由 DB 状态机（SENT/PENDING/SKIPPED/FAILED/DISPATCHED）
# + NotificationRetryTask（原子认领 claimForRetry + 指数退避 + 60s 租约）负责。
feign:
  client:
    config:
      default:
        connect-timeout: 3000
        read-timeout: 8000

# 日志格式：把 MDC 里的 requestId 打出来，使同一请求跨服务的日志可以按 ID 捞取。
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}/%X{spanId:-}] [%X{requestId:-}] [%thread] %logger{36} - %msg%n"
