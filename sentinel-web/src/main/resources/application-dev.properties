server.port=8080

# TODO  choose : [kafka]/[eventBus]/[rocketMq]/[rabbitMq],recommend  [eventBus] or  [kafka]
sentinel.mq.pipeline=eventBus

# todo [xxl-job] switch
sentinel.xxl.job.enabled=false

# todo choose: [apollo]/[nacos] switch  ,if [apollo] and [nacos] both false, use local.properties
sentinel.apollo.enabled=false
sentinel.nacos.enabled=false

# TODO [hades] switch
sentinel.rule.engine.enabled=false

# TODO if windows os and need upload file to send message  ,replace path !
sentinel.business.upload.crowd.path=/tmp/sentinel-upload

# TODO Whether to enable [sensitive word filter] and set the [path] of sensitive words dictionary
sentinel.senswords.filter.enabled=true
sentinel.senswords.dict.path=classpath:sensitive-words.txt

########################################## Sentinel AI Agent start ##########################################
# 通义千问（DashScope）API Key
dashscope.api-key=${DASHSCOPE_API_KEY:}
# 模型名称：qwen-plus（推荐）/ qwen-turbo（快速）/ qwen-max（最强）
dashscope.model-name=qwen-plus
# 单次请求超时（秒），超时后 Agent 降级到模板（文案生成实测需 3-8s，3s 必降级）
dashscope.timeout-seconds=10

# ===== Sentinel LiteFlow 编排 =====
# 通知渠道（实际渠道由 sentinel.dispatch.template-id 对应模板决定）
sentinel.flow.notify-channel=sms
# DB 规则热更新：启动时自动建 lf_* 表并发布默认 sentinelExceptionFlow
sentinel.flow.rule-db.enabled=true
sentinel.flow.rule-db.application-name=sentinel
sentinel.flow.rule-db.url=${spring.datasource.url}
sentinel.flow.rule-db.username=${spring.datasource.username}
sentinel.flow.rule-db.password=${spring.datasource.password}
sentinel.flow.rule-db.driver-class-name=${spring.datasource.driver-class-name}
sentinel.flow.rule-db.table-prefix=lf_
sentinel.flow.rule-db.auto-init-table=true
sentinel.flow.rule-db.poll-seconds=3
sentinel.flow.rule-db.reconcile-seconds=30
sentinel.flow.rule-db.cache-capacity=20

# ===== Sentinel 自动化调度 =====
# 订单自动推进开关与周期（模拟物流商轨迹推送驱动状态机）
sentinel.auto-advance.enabled=false
sentinel.auto-advance.interval-ms=30000
# 通知自动分发开关与消息模板 id（模板 3：uid 类型 + SMS 渠道，msgContent 含 {$orderNo}）
sentinel.dispatch.enabled=true
sentinel.dispatch.template-id=3
########################################## Sentinel AI Agent end ##########################################

########################################## Sentinel Login start ##########################################
# 简单登录（演示用，正式应接账号体系/加盐）
sentinel.login.enabled=true
sentinel.login.username=zhangwei
sentinel.login.password=${SENTINEL_ADMIN_PASSWORD:}
sentinel.login.token-ttl-seconds=7200
########################################## Sentinel Login end ##########################################

# ===== P0-2 Outbox =====
sentinel.outbox.topic=sentinel_outbox
sentinel.outbox.publish-interval-ms=5000
sentinel.outbox.batch-size=50
