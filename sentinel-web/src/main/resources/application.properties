spring.profiles.active=dev
spring.application.name=sentinel

########################################## database start ##########################################
# TODO required!
# notice:mysql version 5.7x !!!
spring.datasource.url=jdbc:mysql://${sentinel.database.ip:sentinel-mysql}:${sentinel.database.port:3306}/sentinel?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&useSSL=false&zeroDateTimeBehavior=convertToNull
spring.datasource.username=${sentinel.database.username:root}
spring.datasource.password=${sentinel.database.password:}
spring.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=1000
########################################## database end ##########################################

########################################## redis start ##########################################
# TODO required!
spring.redis.host=${sentinel.redis.ip:sentinel-redis}
spring.redis.port=${sentinel.redis.port:6379}
spring.redis.password=${sentinel.redis.password:}
spring.redis.connect-timeout=10s
########################################## redis end ##########################################


########################################## kafka start ##########################################
spring.kafka.bootstrap-servers=${sentinel.kafka.ip:sentinel-kafka}:${sentinel.kafka.port:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.auto-commit-interval=1000
spring.kafka.consumer.enable-auto-commit=true

###
sentinel.business.topic.name=sentinelBusiness
sentinel.business.recall.topic.name=sentinelRecall
sentinel.business.log.topic.name=sentinelTraceLog
sentinel.business.recall.group.name=recallGroupId
### TODO kafka tag filter,if you need, replace  tagIdValue ,eg:com.aroura.sentinel.yyy
sentinel.business.tagId.key=kafka_tag_id
sentinel.business.tagId.value=com.aroura.sentinel
########################################## kafka end ##########################################


########################################## rocketMq start ##########################################
rocketmq.name-server=${sentinel.rocketmq.nameserver.ip:}:${sentinel.rocketmq.nameserver.port:}
rocketmq.producer.group=unique-producer-group
sentinel.rocketmq.biz.consumer.group=unique-biz-consumer-group
sentinel.rocketmq.recall.consumer.group=unique-recall-consumer-group
########################################## rocketMq end ##########################################


########################################## RabbitMq start ##########################################
spring.rabbitmq.host=${sentinel.rabbitmq.ip:}
spring.rabbitmq.port=${sentinel.rabbitmq.port:}
spring.rabbitmq.username=root
spring.rabbitmq.password=${sentinel.rabbitmq.password:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.virtual-host=/
#enable retry
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-attempts=3
sentinel.rabbitmq.exchange.name=sentinel.point
spring.rabbitmq.queues.send=sentinel.queues.send
spring.rabbitmq.queues.recall=sentinel.queues.recall
sentinel.rabbitmq.routing.send=sentinel.send
sentinel.rabbitmq.routing.recall=sentinel.recall
########################################## RabbitMq end ##########################################


########################################## xxl start ##########################################
xxl.job.admin.addresses=http://${sentinel.xxl.job.ip:sentinel-xxl-job}:${sentinel.xxl.job.port:8080}/xxl-job-admin
xxl.job.admin.username=${sentinel.xxl.job.username:admin}
xxl.job.admin.password=${sentinel.xxl.job.password:}
xxl.job.executor.appname=${sentinel.xxl.job.executor.appname:sentinel}
xxl.job.executor.jobHandlerName=${sentinel.xxl.job.executor.jobHandlerName:sentinelJob}
xxl.job.executor.address=${sentinel.xxl.job.address:}
xxl.job.executor.ip=
xxl.job.executor.port=${sentinel.xxl.executor.port:6666}
xxl.job.executor.logpath=logs/xxl
xxl.job.executor.logretentiondays=30
xxl.job.accessToken=${sentinel.xxl.job.accessToken:}
########################################## xxl end ##########################################

########################################## apollo start ##########################################
app.id=sentinel
apollo.bootstrap.enabled=${sentinel.apollo.enabled:false}
apollo.bootstrap.namespaces=${sentinel.default.apollo.namespace:boss.sentinel},dynamic-tp-apollo-dtp.yml
########################################## apollo end ##########################################

########################################## nacos start ##########################################
nacos.config.server-addr=${sentinel.nacos.addr.ip:sentinel-nacos}:${sentinel.nacos.addr.port:8848}
nacos.config.username=${sentinel.nacos.username:nacos}
nacos.config.password=${sentinel.nacos.password:}
nacos.config.namespace=${sentinel.nacos.namespace:hades}
nacos.config.enabled=${sentinel.nacos.enabled:false}

nacos.data-id=${sentinel.nacos.dataId:sentinel}
nacos.group=${sentinel.nacos.group:DEFAULT_GROUP}
########################################## nacos end ##########################################

########################################## rule Engine start ##########################################
hades.enabled=${sentinel.rule.engine.enabled:false}
hades.config-name=${sentinel.rule.engine.file-name:hades}
########################################## rule Engine end ##########################################

########################################## log start ##########################################
sentinel.graylog.ip=${sentinel.graylog:sentinel-graylog}
########################################## log end ##########################################


########################################## httpUtils start ##########################################
ok.http.connect-timeout=30
ok.http.keep-alive-duration=300
ok.http.max-idle-connections=200
ok.http.read-timeout=30
ok.http.write-timeout=30
########################################## httpUtils end ##########################################

########################################## monitor start ##########################################
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoints.web.exposure.include=*
management.metrics.export.prometheus.enabled=true
management.health.rabbit.enabled=false
########################################## monitor end ##########################################

########################################## system start ##########################################
server.shutdown=graceful
########################################## system end ##########################################

