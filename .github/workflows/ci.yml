name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  microservices:
    name: Microservices (mvn test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install parent POM
        run: mvn -B -ntp -N install
      - name: Microservice backend tests
        run: mvn -B -ntp test

  deployment-smoke:
    name: Docker deployment smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build service jars
        run: |
          mvn -B -ntp -N install -q
          mvn -B -ntp -pl services/auth-service,services/msg-service,services/logistics-service,services/agent-service,gateway -am package -DskipTests
          mkdir -p dist
          cp services/auth-service/target/auth-service.jar dist/
          cp services/msg-service/target/msg-service.jar dist/
          cp services/logistics-service/target/logistics-service.jar dist/
          cp services/agent-service/target/agent-service.jar dist/
          cp gateway/target/sentinel-gateway.jar dist/
      - name: Prepare environment file
        run: cp infra/docker/.env.example infra/docker/.env
      - name: Validate compose config
        working-directory: infra/docker
        run: docker compose -f compose.infra.yml config --quiet
      - name: Pull base images
        working-directory: infra/docker
        run: |
          for attempt in 1 2 3; do
            if docker compose -f compose.infra.yml pull --ignore-buildable; then
              echo "pull ok on attempt $attempt"; exit 0
            fi
            echo "pull attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "基础镜像连续拉取失败 3 次"; exit 1
      - name: Start stack
        working-directory: infra/docker
        run: docker compose -f compose.infra.yml up -d --build
      - name: Show container states
        if: always()
        working-directory: infra/docker
        run: docker compose -f compose.infra.yml ps -a
      - name: Wait for gateway login
        run: |
          for i in $(seq 1 60); do
            body=$(curl -s -m 10 -X POST http://localhost:8080/api/auth/login \
              --data-urlencode 'username=张伟' --data-urlencode 'password=Admin@123' || true)
            if echo "$body" | grep -q '"status":"0"'; then
              echo "gateway login ok after ~$((i*5))s"
              exit 0
            fi
            sleep 5
          done
          echo "gateway did not accept login within timeout"
          exit 1
      - name: End-to-end smoke
        working-directory: infra/tools
        run: SMOKE_DOCKER=1 bash smoke_closed_loop.sh
      - name: Dump service logs on failure
        if: failure()
        working-directory: infra/docker
        run: docker compose -f compose.infra.yml logs --no-color --tail 120
      - name: Tear down
        if: always()
        working-directory: infra/docker
        run: docker compose -f compose.infra.yml down -v --remove-orphans
