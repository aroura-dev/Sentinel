# 上游连接池：nginx 默认对 proxy_pass 用 HTTP/1.0 且不回传 keep-alive，
# 等于每个 API 请求都新建一条到后端的 TCP 连接。实测 100 并发下这一跳
# 砍掉约 47% 吞吐、翻倍延迟（1914 rps/48ms vs 直连 3584 rps/25ms）。
# 复用长连接后为 3282 rps/28ms，基本追平直连。
# 注意：只加 proxy_http_version 1.1 + Connection "" 而不定义 upstream 块是无效的，
# nginx 仍不池化连接，反而会制造连接风暴（实测 62.79% 502 / EADDRNOTAVAIL）。
upstream sentinel_backend {
    server backend:8080;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 代理
    location /api/ {
        proxy_pass http://sentinel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 上游长连接复用时，Tomcat 达到 maxKeepAliveRequests 会主动关闭，
        # 复用到已关闭的连接会报 502，这里按需重试一次（本场景均为幂等 GET）
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
    }
}
