name: ci

# sentinel-ms 最小 CI：build 全部服务 -> 出 jar -> 构建镜像 -> 起整套 compose -> 端到端 smoke -> 拆栈
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build all service jars
        run: |
          mvn -B -N install -q
          mvn -B -pl services/auth-service,services/msg-service,services/logistics-service,services/agent-service,gateway -am package -DskipTests
          mkdir -p dist
          cp services/auth-service/target/auth-service.jar dist/
          cp services/msg-service/target/msg-service.jar dist/
          cp services/logistics-service/target/logistics-service.jar dist/
          cp services/agent-service/target/agent-service.jar dist/
          cp gateway/target/sentinel-gateway.jar dist/

      - name: Build & start full stack (infra + 5 services + sms-stub)
        run: |
          cd infra/docker
          docker compose -f compose.infra.yml build
          docker compose -f compose.infra.yml up -d

      - name: Wait for gateway
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null -X POST http://localhost:8080/api/auth/login -d 'username=zhangwei&password=Admin@123' 2>/dev/null; then
              echo "gateway ready after ~$((i*5))s"; exit 0
            fi
            sleep 5
          done
          echo "gateway not ready"; exit 1

      - name: End-to-end smoke
        run: |
          cd infra/tools
          SMOKE_DOCKER=1 bash smoke_closed_loop.sh

      - name: Tear down
        if: always()
        run: cd infra/docker && docker compose -f compose.infra.yml down -v --remove-orphans
