server:
  port: 8083
  # 收到 SIGTERM 后先处理完在途请求再退出（默认超时 30s），避免发布时丢请求。
  shutdown: graceful

# 健康检查：actuator 挂在 /actuator（不在 /api 前缀下），因此不经网关暴露；
# 配合端口收敛（见 infra/docker/compose.infra.yml），仅 compose 内部网络可达，
# 供容器 healthcheck 与编排就绪判断使用。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

spring:
  application:
    name: logistics-service
  datasource:
    url: jdbc:mysql://127.0.0.1:33063/sentinel_logistics?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

sentinel:
  login:
    enabled: true

# 通知闭环相关开关/模板（与单体一致）
notify:
  dispatch:
    enabled: true
    template-id: 3
  dedup-hours: 24

# 跨服务 REST 目标（本机联调；容器化后改服务名）
service:
  agent-url: http://127.0.0.1:8084
  msg-url: http://127.0.0.1:8082
