server:
  port: 8081
  # 收到 SIGTERM 后先处理完在途请求再退出（默认超时 30s），避免发布时丢请求。
  shutdown: graceful

# 健康检查：actuator 挂在 /actuator（不在 /api 前缀下），因此不经网关暴露；
# 配合端口收敛（见 infra/docker/compose.infra.yml），仅 compose 内部网络可达，
# 供容器 healthcheck 与编排就绪判断使用。
management:
  # 指标带服务名标签：多个服务汇聚到 Prometheus 后要能区分来源。
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

# springfox 3.0.0 与 Boot 2.6+ 不兼容：它启动时扫描全部 RequestMapping，
# 遇到 actuator 注册的 WebMvcEndpointHandlerMapping 会抛
# NullPointerException(PatternsRequestCondition.condition is null)，导致上下文刷新失败、服务起不来。
# msg-service 早已按此禁用；这里同样禁用（swagger 在本项目未使用）。
springfox:
  documentation:
    enabled: false

spring:
  # 分布式追踪。Sleuth 自动生成 traceId/spanId 放进 MDC，并跨 HTTP/Kafka 传递。
  # Zipkin 默认关闭：日志里的 traceId 不依赖上报服务，而没有收集端时开启上报只会刷连接错误日志。
  # 需要看链路拓扑时再开：ZIPKIN_ENABLED=true 并启用 observability profile。
  sleuth:
    sampler:
      probability: ${SLEUTH_SAMPLING_PROBABILITY:1.0}
  zipkin:
    enabled: ${ZIPKIN_ENABLED:false}
    base-url: ${ZIPKIN_BASE_URL:http://zipkin:9411}
    sender:
      type: web
  # 数据库迁移：schema 由 Flyway 拥有，迁移脚本在 classpath:db/migration。
  # 注意：本次改造前已存在的数据卷里，schema 是 initdb 建的、没有 flyway_schema_history 表，
  # 需要一次性重建数据卷（down -v）让 Flyway 接管；之后再变更 schema 直接加新版本脚本即可。
  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://127.0.0.1:33061/sentinel_auth?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: 127.0.0.1
    port: 6381
    password: ${SPRING_REDIS_PASSWORD:}
    timeout: 3000ms
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# 与单体 AuthService 一致：token TTL、Redis key sentinel:token:
sentinel:
  login:
    enabled: true
    token-ttl-seconds: 7200

# 记住我（长效 token TTL）与手机号自助注册默认角色
auth:
  remember-ttl-seconds: 604800
  register-default-role: MERCHANT

# 日志格式：把 MDC 里的 requestId 打出来，使同一请求跨服务的日志可以按 ID 捞取。
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}/%X{spanId:-}] [%X{requestId:-}] [%thread] %logger{36} - %msg%n"
