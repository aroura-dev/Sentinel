server:
  port: 8081
  # 收到 SIGTERM 后先处理完在途请求再退出（默认超时 30s），避免发布时丢请求。
  shutdown: graceful

# 健康检查：actuator 挂在 /actuator（不在 /api 前缀下），因此不经网关暴露；
# 配合端口收敛（见 infra/docker/compose.infra.yml），仅 compose 内部网络可达，
# 供容器 healthcheck 与编排就绪判断使用。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# springfox 3.0.0 与 Boot 2.6+ 不兼容：它启动时扫描全部 RequestMapping，
# 遇到 actuator 注册的 WebMvcEndpointHandlerMapping 会抛
# NullPointerException(PatternsRequestCondition.condition is null)，导致上下文刷新失败、服务起不来。
# msg-service 早已按此禁用；这里同样禁用（swagger 在本项目未使用）。
springfox:
  documentation:
    enabled: false

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://127.0.0.1:33061/sentinel_auth?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: 127.0.0.1
    port: 6381
    password: ${SPRING_REDIS_PASSWORD:}
    timeout: 3000ms
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# 与单体 AuthService 一致：token TTL、Redis key sentinel:token:
sentinel:
  login:
    enabled: true
    token-ttl-seconds: 7200

# 记住我（长效 token TTL）与手机号自助注册默认角色
auth:
  remember-ttl-seconds: 604800
  register-default-role: MERCHANT
