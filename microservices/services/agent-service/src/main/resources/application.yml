server:
  port: 8084
  # 收到 SIGTERM 后先处理完在途请求再退出（默认超时 30s），避免发布时丢请求。
  shutdown: graceful

# 健康检查：actuator 挂在 /actuator（不在 /api 前缀下），因此不经网关暴露；
# 配合端口收敛（见 infra/docker/compose.infra.yml），仅 compose 内部网络可达，
# 供容器 healthcheck 与编排就绪判断使用。
management:
  # 指标带服务名标签：多个服务汇聚到 Prometheus 后要能区分来源。
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

spring:
  # 数据库迁移：schema 由 Flyway 拥有，迁移脚本在 classpath:db/migration。
  # 注意：本次改造前已存在的数据卷里，schema 是 initdb 建的、没有 flyway_schema_history 表，
  # 需要一次性重建数据卷（down -v）让 Flyway 接管；之后再变更 schema 直接加新版本脚本即可。
  flyway:
    enabled: true
    locations: classpath:db/migration
  application:
    name: agent-service
  datasource:
    url: jdbc:mysql://127.0.0.1:33064/sentinel_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

# 通义千问（缺 key 时 ContentGenAgent 调用期降级为规则/默认文案，仍写 agent_call_log）
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  model-name: qwen-plus

# 日志格式：把 MDC 里的 requestId 打出来，使同一请求跨服务的日志可以按 ID 捞取。
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] [%thread] %logger{36} - %msg%n"
