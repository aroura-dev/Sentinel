services:
  sentinel-mysql:
    environment:
      TZ: Asia/Shanghai
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD: "root123_A"
    restart: always
    container_name: sentinel-mysql
    image: mysql:5.7
    hostname: mysql
    volumes:
      - ./doc/sql:/schema:ro
      - ./doc/docker/mysql/init-sentinel.sh:/docker-entrypoint-initdb.d/00-init-sentinel.sh:ro
      - ./doc/docker/mysql/mysql.cnf:/etc/mysql/my.cnf
    ports:
      - "3306:3306"
    networks:
      - app
  sentinel-redis:
    image: redis:3.2
    ports:
      - "6379:6379"
    restart: always
    container_name: sentinel-redis
    volumes:
      - ./doc/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:rw
    command:
      /bin/bash -c "redis-server /usr/local/etc/redis/redis.conf"
    networks:
      - app
  sentinel-zookeeper:
    image: zookeeper:3.8.4
    container_name: sentinel-zookeeper
    volumes:
      - "/etc/localtime:/etc/localtime"
    ports:
      - "2181:2181"
    networks:
      - app
  sentinel-kafka:
    image: wurstmeister/kafka
    container_name: sentinel-kafka
    volumes:
      - "/etc/localtime:/etc/localtime"
    environment:
      KAFKA_BROKER_ID: 0
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://sentinel-kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: sentinel-zookeeper:2181
      KAFKA_CREATE_TOPICS: "sentinelBusiness:1:1,sentinelRecall:1:1,sentinelTraceLog:1:1"
      KAFKA_HEAP_OPTS: -Xmx512M -Xms256M
    ports:
      - "9092:9092"
    depends_on:
      - sentinel-zookeeper
    networks:
      - app
  jobmanager:
    image: flink:1.16.1
    ports:
      - "8081:8081"
    command:
      - jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
      - SET_CONTAINER_TIMEZONE=true
      - CONTAINER_TIMEZONE=Asia/Shanghai
      - TZ=Asia/Shanghai
    volumes:
      - ./sentinel-stream/target/sentinel-stream-0.0.1-SNAPSHOT.jar:/opt/sentinel-stream-0.0.1-SNAPSHOT.jar:rw
    depends_on:
      - sentinel-zookeeper
      - sentinel-kafka
    networks:
      - app
  taskmanager:
    image: flink:1.16.1
    depends_on:
      - jobmanager
      - sentinel-zookeeper
      - sentinel-kafka
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
      - SET_CONTAINER_TIMEZONE=true
      - CONTAINER_TIMEZONE=Asia/Shanghai
      - TZ=Asia/Shanghai
    networks:
      - app
  sentinel-xxl-job:
    image: xuxueli/xxl-job-admin:2.3.0
    container_name: sentinel-xxl-job
    ports:
      - "8080:8080"
    environment:
      PARAMS: '--spring.datasource.url=jdbc:mysql://sentinel-mysql:3306/xxl_job?Unicode=true&characterEncoding=UTF-8 --spring.datasource.username=root  --spring.datasource.password=root123_A'
    networks:
      - app
    depends_on:
      - sentinel-mysql
  sentinel-nacos:
    container_name: sentinel-nacos-server
    image: nacos/nacos-server:v2.1.0
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=sentinel-mysql
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=root123_A
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - JVM_XMS=128m
      - JVM_XMX=128m
      - JVM_XMN=128m
    volumes:
      - /home/nacos/single-logs/nacos-server:/home/nacos/logs
      - /home/nacos/init.d:/home/nacos/init.d
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - sentinel-mysql
    restart: on-failure
    networks:
      - app
  sentinel:
    build:
      context: ./
    ports:
      - "7777:8080"
    restart: always
    container_name: sentinel
    environment:
      - SET_CONTAINER_TIMEZONE=true
      - CONTAINER_TIMEZONE=Asia/Shanghai
      - TZ=Asia/Shanghai
    depends_on:
      - sentinel-redis
      - sentinel-mysql
      - sentinel-zookeeper
      - sentinel-kafka
      - sentinel-xxl-job
      - sentinel-nacos
    networks:
      - app
networks:
  app:
